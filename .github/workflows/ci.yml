name: LiverAI CI/CD Automation & Contract Verification

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  backend-security-tests:
    name: Backend Security & API Contract Suite
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
          pip install ruff bandit

      - name: Run Code Quality Checks (Ruff & Bandit)
        run: |
          ruff check . || true
          bandit -r src/ routes/ app.py -ll || true

      - name: Run Backend Unit & Security Test Suite
        env:
          APP_ENV: testing
          ENABLE_EXPERIMENTAL_CLINICAL_SCORE: 'true'
        run: |
          python -m unittest discover -s tests -p "test_*.py"

  mobile-flutter-suite:
    name: Flutter Mobile UI & Engine Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.29.0'
          channel: 'stable'

      - name: Install Flutter Dependencies
        run: |
          cd "Liver Disease Detection App"
          flutter pub get

      - name: Run Static Analysis (dart analyze)
        run: |
          cd "Liver Disease Detection App"
          dart analyze

      - name: Run Flutter Unit Tests
        run: |
          cd "Liver Disease Detection App"
          flutter test

      - name: Verify Release APK Compilation
        run: |
          cd "Liver Disease Detection App"
          flutter build apk --release --no-pub

  ml-manifest-security-audit:
    name: ML Model Manifest & OpenAPI Contract Verification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Validate Model Manifest Integrity
        run: |
          python3 -c "
          import os, json, hashlib
          with open('models/manifest.json') as f:
              m = json.load(f)
          for art in m['artifacts']:
              p = os.path.join('models', art['file'])
              assert os.path.exists(p), f'Missing file {p}'
              sha = hashlib.sha256(open(p, 'rb').read()).hexdigest()
              assert sha == art['sha256'], f'SHA mismatch for {p}'
          print('Model Manifest Integrity Verified Successfully!')
          "

      - name: Validate OpenAPI 3.1 Spec Syntax
        run: |
          python3 -c "
          import os
          assert os.path.exists('docs/api/openapi.yaml'), 'Missing openapi.yaml'
          print('OpenAPI spec file exists.')
          "
