name: liver_disease_detection_app
description: "LiverAI — Precision Diagnostics & Analytics"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  image: ^4.5.4
  image_picker: ^1.1.2
  shared_preferences: ^2.5.2
  flutter_markdown: ^0.7.6+1
  intl: ^0.20.2
  http: ^1.4.0
  supabase_flutter: ^2.0.0
  google_sign_in: ^6.2.2
  url_launcher: ^6.3.1


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/liverai_emblem.png"
  min_sdk_android: 21
  adaptive_icon_background: "#060D17"
  adaptive_icon_foreground: "assets/images/liverai_emblem.png"

flutter:
  uses-material-design: true

  assets:
    - assets/models/
    - assets/images/
    - assets/icons/

